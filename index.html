<!DOCTYPE html>
<html lang="ro">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Galerie Icoane</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600;9..144,700&family=Outfit:wght@400;500;600;700;800&family=Cormorant+Garamond:wght@600&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#fbf0e2;
    --ink:#33170a;
    --muted:#93694a;
    --hair:#edcda0;
    --panel:#f5dcab;
    --gold:#b8611a;
    --gold-soft:#e08a3a;
    --gold-mat:#f2cd8e;
    --oxblood:#8a2e15;
    --shadow:0 5px 18px -5px rgba(51,23,10,.6);
    --shadow-sm: 0 4px 15px -5px rgb(137 63 29 / 37%);
}
  *{box-sizing:border-box; -webkit-tap-highlight-color:transparent;}
  html,body{margin:0;padding:0;}
  body{
    background:var(--bg);
    color:var(--ink);
    font-family:-apple-system,BlinkMacSystemFont,'Inter',sans-serif;
    -webkit-font-smoothing:antialiased;
    text-rendering:optimizeLegibility;
  }

  /* ---------- LOADER (schiță alb-negru a site-ului) ---------- */
  .loader{
    position:fixed; inset:0;
    background:var(--bg);
    overflow:hidden;
    z-index:9999;
    transition:opacity .5s ease, visibility .5s ease;
}
  .loader.hide{
    opacity:0;
    visibility:hidden;
    pointer-events:none;
  }
  .sk-wrap{
    max-width:1040px;
    margin:0 auto;
    padding:64px 10px;
  }
  .shimmer{
    background:linear-gradient(90deg, var(--hair) 25%, var(--gold-mat) 37%, var(--hair) 63%);
    background-size:400% 100%;
    animation:skShimmer 1.6s ease-in-out infinite;
  }
  @keyframes skShimmer{
    0%{ background-position:100% 50%; }
    100%{ background-position:0 50%; }
  }
  .sk-header{ text-align:center; margin-bottom:34px; }
  .sk-bar{ border-radius:6px; margin:0 auto; }
  .sk-eyebrow{ width:70px; height:10px; margin-bottom:14px; }
  .sk-title{ width:260px; height:26px; margin-bottom:12px; }
  .sk-sub{ width:200px; height:12px; }
  .sk-search{
    width:100%;
    max-width:420px;
    height:44px;
    border-radius:14px;
    margin:0 auto 18px;
  }
  .sk-filters{
    display:flex;
    justify-content:center;
    gap:8px;
    margin-bottom:36px;
  }
  .sk-pill{ width:70px; height:34px; border-radius:12px; }
  .sk-grid{
    display:grid;
    grid-template-columns:repeat(2,1fr);
    gap:10px;
  }
  @media (min-width:600px){ .sk-grid{ grid-template-columns:repeat(3,1fr); gap:20px; } }
  @media (min-width:900px){ .sk-grid{ grid-template-columns:repeat(4,1fr); } }
  .sk-card{
    border-radius:20px;
    background:#ffffff;
    box-shadow:var(--shadow-sm);
    overflow:hidden;
    position:relative;
  }

/* DUPĂ */
  .sk-card::after{
    content:'';
    position:absolute;
    top:-60%; bottom:-60%;
    width:70%; left:-90%;
    transform:rotate(15deg);
    background:linear-gradient(90deg,
      rgba(255,255,255,0) 0%,
      rgba(255,255,255,.15) 30%,
      rgba(255,255,255,.55) 50%,
      rgba(255,255,255,.15) 70%,
      rgba(255,255,255,0) 100%);
    filter:blur(0px);
    animation:cardRaySweep 1.5s cubic-bezier(.42,0,.58,1) infinite;
  }
  @keyframes cardRaySweep{
    0%{ left:-90%; }
    55%{ left:130%; }
    100%{ left:130%; }
  }
  .sk-thumb-wrap{ padding:7px; }
  .sk-thumb{ aspect-ratio:3/4; border-radius:14px; }
  .sk-caption{ padding:13px 14px 15px; }
  .sk-line{ height:9px; border-radius:4px; margin-top:12px; }
  .sk-line.short{ width:55%; height:8px; margin-top:8px; }

  /* ---------- HEADER / BRAND ---------- */
  header{
    max-width:1040px;
    margin:0 auto;
    padding:56px 24px 20px;
    text-align:center;
  }
  .brand{
    display:flex;
    flex-direction:column;
    align-items:center;
    gap:16px;
  }
.brand-mark{
  width:68px; height:68px;
  border-radius:50%;
  background:#fff;
  display:flex;
  align-items:center;
  justify-content:center;
  overflow:hidden;   /* NOU — taie orice depășește cercul */
}
.brand-mark img{
  width:100%; height:100%;
  object-fit:cover;      /* schimbat din contain în cover */
  border-radius:50%;     /* NOU — taie imaginea în formă de cerc */
  display:block;

}
  .brand-mark-fallback{
    display:none;
    width:100%; height:100%;
    align-items:center;
    justify-content:center;
    color:var(--gold);
  }
  .brand-mark-fallback svg{ width:52%; height:52%; }
  .brand-name{
    font-family:'Fraunces',serif;
    font-weight:600;
    font-size:15px;
    letter-spacing:.18em;
    text-transform:uppercase;
    color:var(--ink);
    margin:0;
  }

  /* ---------- SEARCH BAR (iOS style) ---------- */
.search-wrap{
    max-width:1040px;
    margin:26px auto 0;
    padding:0 24px;
    display:flex;
    justify-content:center;
    align-items:center;
    gap:10px;
  }

  .custom-btn{
    position:relative;
    flex:0 0 auto;
    width:44px;
    height:44px;
    border-radius:14px;
    border:none;
    background:var(--panel);
    color:var(--gold);
    display:flex;
    align-items:center;
    justify-content:center;
    cursor:pointer;
    transition:background .2s ease, color .2s ease;
  }
  .custom-btn:hover{ background:var(--gold-mat); }
  .custom-btn svg{ width:18px; height:18px; overflow:visible; }

  .custom-btn .icon-plus,
  .custom-btn .icon-smile{
    transform-origin:12px 12px;
  }
  .custom-btn .icon-plus{
    opacity:1;
    transform:scale(1) rotate(0deg);
    transition:opacity .22s ease .18s, transform .3s cubic-bezier(.4,0,.2,1) .18s;
  }
  .custom-btn .icon-smile{
    opacity:0;
    transform:scale(.3) rotate(-90deg);
    transition:opacity .28s ease, transform .38s cubic-bezier(.34,1.56,.64,1);
  }
  .custom-btn:hover .icon-plus{
    opacity:0;
    transform:scale(.3) rotate(90deg);
    transition:opacity .18s ease, transform .22s cubic-bezier(.4,0,.2,1);
  }
  .custom-btn:hover .icon-smile{
    opacity:1;
    transform:scale(1.35) rotate(0deg);
    transition:opacity .3s ease .2s, transform .4s cubic-bezier(.34,1.56,.64,1) .2s;
  }
  .custom-btn .tooltip{
    position:absolute;
    bottom:calc(100% + 9px);
    left:50%;
    transform:translateX(-50%) translateY(4px);
    background:var(--ink);
    color:#fff;
    font-size:11.5px;
    font-weight:600;
    padding:5px 10px;
    border-radius:8px;
    white-space:nowrap;
    opacity:0;
    pointer-events:none;
    transition:opacity .18s ease, transform .18s ease;
  }
  .custom-btn:hover .tooltip{
    opacity:1;
    transform:translateX(-50%) translateY(0);
  }
  .search-bar{
    position:relative;
    width:100%;
    max-width:420px;
  }
  .search-bar svg.search-icon{
    position:absolute;
    left:14px; top:50%;
    transform:translateY(-50%);
    width:16px; height:16px;
    color:var(--muted);
    pointer-events:none;
    transition:color .22s ease, transform .32s cubic-bezier(.34,1.56,.64,1);
  }
  .search-bar:hover svg.search-icon,
  .search-bar:focus-within svg.search-icon{
    color:var(--gold);
    transform:translateY(-50%) scale(1.12) rotate(-8deg);
  }
  .search-bar input{
    width:100%;
    font-family:inherit;
    font-size:14.5px;
    font-weight:500;
    color:var(--ink);
    background:var(--panel);
    border:1px solid transparent;
    border-radius:14px;
    padding:12px 40px 12px 38px;
    outline:none;
    transition:background .2s ease, border-color .2s ease, box-shadow .2s ease;
  }
  .search-bar input::placeholder{ color:var(--muted); font-weight:500; }
  .search-bar input:hover{
    background:var(--gold-mat);
  }
  .search-bar input:focus{
    background:#ffffff;
    border-color:var(--gold-soft);
    box-shadow:0 0 0 4px rgba(169,120,31,.12);
  }
  .search-clear{
    position:absolute;
    right:8px; top:50%;
    transform:translateY(-50%) scale(.7);
    width:22px; height:22px;
    border:none;
    border-radius:50%;
    background:var(--hair);
    color:var(--ink);
    display:flex; align-items:center; justify-content:center;
    cursor:pointer;
    opacity:0;
    pointer-events:none;
    transition:opacity .15s ease, transform .15s ease, background .15s ease;
  }
  .search-clear svg{ width:10px; height:10px; }
  .search-clear:hover{ background:var(--gold-mat); }
  .search-bar.has-value .search-clear{
    opacity:1;
    pointer-events:auto;
    transform:translateY(-50%) scale(1);
  }
  .search-count{
    text-align:center;
    font-size:12px;
    font-weight:600;
    color:var(--muted);
    margin-top:9px;
    min-height:16px;
  }
  .search-count b{ color:var(--gold); font-weight:700; }

  /* ---------- SEGMENTED FILTER (iOS style) ---------- */
  .filters{
    max-width:1040px;
    margin:20px auto 0;
    padding:0 24px;
    display:flex;
    justify-content:center;
  }
  .segment{
    display:inline-flex;
    background:var(--panel);
    border-radius:14px;
    padding:4px;
    gap:2px;
  }
  .seg-btn{
    font-family:inherit;
    font-size:14px;
    font-weight:600;
    color:var(--muted);
    background:transparent;
    border:none;
    padding:9px 20px;
    border-radius:11px;
    cursor:pointer;
    display:flex;
    align-items:center;
    gap:6px;
    transition:background .2s ease, color .2s ease, box-shadow .2s ease;
  }
  .seg-btn.active{
    background:#ffffff;
    box-shadow:var(--shadow-sm);
    color: var(--isk);
  }
  .seg-btn svg{ width:12px; height:12px; opacity:.75; transition:transform .25s ease; }
  .seg-btn.desc svg{ transform:rotate(180deg); }
  .seg-btn:not(.active):hover{ color:var(--ink); }

  .seg-wrap{ position:relative; }
  .dropdown{
    position:absolute;
    top:calc(100% + 8px);
    left:50%;
    transform:translate(-50%,-6px);
    background:#fff;
    border-radius:14px;
    box-shadow:var(--shadow);
    padding:6px;
    min-width:172px;
    opacity:0;
    pointer-events:none;
    transition:opacity .18s ease, transform .18s ease;
    z-index:30;
  }
  .dropdown.open{
    opacity:1;
    pointer-events:auto;
    transform:translate(-50%,0);
  }
  .dropdown-opt{
    display:flex;
    align-items:center;
    justify-content:space-between;
    width:100%;
    font-family:inherit;
    font-size:13.5px;
    font-weight:600;
    color:var(--ink);
    background:transparent;
    border:none;
    text-align:left;
    padding:9px 12px;
    border-radius:9px;
    cursor:pointer;
    transition:background .15s ease;
  }
  .dropdown-opt:hover{ background:var(--panel); }
  .dropdown-opt.active{ background:var(--gold-mat); color:var(--gold); }
  .dropdown-opt svg{ width:13px; height:13px; opacity:0; }
  .dropdown-opt.active svg{ opacity:1; }

  /* ---------- GRID ---------- */
  .grid-wrap{ max-width:1040px; margin:0 auto; padding:34px 10px 90px; }
  .grid{
    display:grid;
    grid-template-columns:1fr;
    gap:10px;
  }
  @media (min-width:360px){ .grid{ grid-template-columns:repeat(2,1fr); } }
  @media (min-width:600px){ .grid{ grid-template-columns:repeat(3,1fr); gap:20px; } }
  @media (min-width:900px){ .grid{ grid-template-columns:repeat(4,1fr); } }

  .card{
    cursor:pointer;
    border-radius:20px;
    background:#ffffff;
    box-shadow:var(--shadow-sm);
    overflow:hidden;
    transition:transform .28s cubic-bezier(.2,.8,.2,1), box-shadow .28s ease, opacity .9s cubic-bezier(.16,.6,.2,1) var(--reveal-delay,0s), filter .9s cubic-bezier(.16,.6,.2,1) var(--reveal-delay,0s);
    opacity:0;
    transform:translateY(14px);
  }

  .card.in-view{
    opacity:1;
    filter:blur(0);
  }
  .card.in-view:not(:hover):not(:active){
    transform:translateY(0);
  }
  .card:hover{ transform:translateY(-3px); box-shadow:var(--shadow); }
  .card:active{ transform:translateY(0) scale(.985); }

  /* "mat + frame" treatment — modern nod to an icon frame */
  .thumb{
    position:relative;
    aspect-ratio:3/4;
    padding:7px;
    background:#fff;
  }
  .thumb-inner{
    position:relative;
    width:100%; height:100%;
    border-radius:14px;
    overflow:hidden;
    background:var(--panel);
  }
  .thumb-inner img{
    width:100%; height:100%;
    object-fit:cover;
    display:block;
    transition:transform .5s cubic-bezier(.2,.7,.2,1), opacity .25s ease;
  }
  .card:hover .thumb-inner img{ transform:scale(1.05); }

  .thumb-state{
    position:absolute; inset:0;
    display:none;
    align-items:center;
    justify-content:center;
    background:var(--panel);
    color:var(--muted);
  }
  .thumb-state.show{ display:flex; }
  .thumb-spinner{
    width:22px; height:22px;
    border-radius:50%;
    border:3px solid var(--hair);
    border-top-color:var(--gold);
    animation:imgSpin .7s linear infinite;
  }
  .thumb-broken{
    display:none;
    align-items:center;
    justify-content:center;
  }
  .thumb-broken svg{ width:22px; height:22px; opacity:.8; }
  .thumb-state.broken .thumb-spinner{ display:none; }
  .thumb-state.broken .thumb-broken{ display:flex; }
  @keyframes imgSpin{ to{ transform:rotate(360deg); } }

  .multi-badge{
    position:absolute;
    top:14px; right:14px;
    background:rgba(36,26,18,.55);
    -webkit-backdrop-filter:blur(6px);
    backdrop-filter:blur(1px);
    color:#fff;
    font-size:11px;
    font-weight:700;
    padding:4px 9px;
    border-radius:20px;
    display:flex;
    align-items:center;
    gap:4px;
  }
  .multi-badge svg{ width:11px; height:11px; }

  .caption{
    padding:13px 14px 15px;
  }
  .caption .nume{
    font-size:14.5px;
    font-weight:700;
    line-height:1.3;
    margin:0 0 4px;
    letter-spacing:-.005em;
  }
  .caption .pret{
    display:inline-block;
    font-size:14.5px;
    font-weight:700;
    color:var(--oxblood);
    padding:0px 0px;
  }
  .caption .info-row{
    display:flex;
    align-items:center;
    gap:6px;
    flex-wrap:wrap;
  }
  .caption .dim{
    display:inline-block;
    font-size:11.5px;
    font-weight:600;
    color:#927233;
    background:var(--panel);
    padding:3px 9px;
    border-radius:20px;
  }

  /* ---------- EMPTY STATE ---------- */
  .empty-state{
    display:none;
    text-align:center;
    padding:60px 24px;
  }
  .empty-state.show{ display:block; }
  .empty-state .e-icon{
    width:52px; height:52px;
    margin:0 auto 18px;
    border-radius:50%;
    background:var(--panel);
    display:flex; align-items:center; justify-content:center;
    color:var(--gold);
  }
  .empty-state .e-icon svg{ width:22px; height:22px; }
  .empty-state p{
    font-size:14.5px;
    font-weight:600;
    color:var(--muted);
    margin:0 0 16px;
  }
  .empty-state p b{ color:var(--ink); }
  .empty-reset{
    font-family:inherit;
    font-size:13px;
    font-weight:700;
    color:var(--gold);
    background:var(--gold-mat);
    border:none;
    padding:9px 18px;
    border-radius:20px;
    cursor:pointer;
    transition:background .15s ease;
  }
  .empty-reset:hover{ background:var(--gold-soft); color:#fff; }

/* ---------- LIGHTBOX ---------- */
  .lightbox{
    position:fixed; inset:0;
    background:rgba(28,20,14,.6);
    -webkit-backdrop-filter:blur(18px) saturate(140%);
    backdrop-filter:blur(18px) saturate(140%);
    display:none;
    align-items:center;
    justify-content:center;
    z-index:100;
    padding:20px;
  }
  .lightbox.open{ display:flex; }
  .lb-card{
    max-width:420px;
    width:100%;
    background:#fff;
    border-radius:28px;
    box-shadow:0 30px 60px -20px rgba(36,26,18,.45);
    overflow:hidden;
    animation:pop .32s cubic-bezier(0.2, 0.9, 0.23, 1.23);
  }
  @keyframes pop{ from{ opacity:0; transform:scale(.92) translateY(10px);} to{ opacity:1; transform:scale(1) translateY(0);} }

  .lb-frame{
    position:relative;
    padding:10px;
    background:#fff;
  }
  .lb-frame-inner{
    position:relative;
    width:100%;
    aspect-ratio:3/4;
    border-radius:18px;
    overflow:hidden;
    background:var(--panel);
  }
  .lb-frame-inner img{
    width:100%; height:100%;
    object-fit:cover;
    display:block;
    cursor:zoom-in;
    transition:transform .35s cubic-bezier(.2,.8,.2,1), opacity .25s ease;
    transform-origin:center;
  }
  .lb-frame-inner img.dragging{
    transition:none;
  }

  .lb-frame-inner img.zoomed{
    transform:scale(3.5);
    cursor:zoom-out;
  }
  .lb-frame-inner img.is-hidden{
    opacity:0;
    pointer-events:none;
  }

  .lb-img-state{
    position:absolute; inset:0;
    display:none;
    align-items:center;
    justify-content:center;
    flex-direction:column;
    gap:10px;
    background:var(--panel);
    color:var(--muted);
    text-align:center;
    padding:20px;
  }
  .lb-img-state.show{ display:flex; }
  .lb-loading{
    display:none;
    overflow:hidden;
    align-items:center;
    justify-content:center;
    background:linear-gradient(135deg, var(--panel) 0%, #ecdcb4 100%);
  }
  .lb-loading.show{ display:flex; }
  .lb-loading-icon{
    position:relative;
    z-index:1;
    width:30px; height:30px;
    color:#c2a875;
  }
  .lb-shimmer-bar{
    position:absolute;
    top:-20%; bottom:-20%;
    width:45%; left:-45%;
    transform:rotate(8deg);
    background:linear-gradient(90deg,
      rgba(255,255,255,0) 0%,
      rgba(255,251,235,0.15) 25%,
      rgba(255,251,235,0.55) 48%,
      rgba(255,255,255,0.85) 50%,
      rgba(255,251,235,0.55) 52%,
      rgba(255,251,235,0.15) 75%,
      rgba(255,255,255,0) 100%);
    animation:shimmerSweep .73s cubic-bezier(.37,0,.63,1) infinite;
  }
  @keyframes shimmerSweep{
    0%{ left:-45%; }
    55%{ left:100%; }
    100%{ left:100%; }
  }
  .lb-broken svg{ width:28px; height:28px; opacity:.85; }
  .lb-broken span{
    font-size:12px;
    font-weight:600;
  }

  .lb-zoom-hint{
    position:absolute;
    bottom:5px; right:5px;
    width:26px; height:26px;
    background:rgba(255,255,255,.9);
    border-radius:50%;
    display:flex; align-items:center; justify-content:center;
    color:var(--ink);
    pointer-events:none;
    opacity:.85;
    transition:opacity .2s ease;
  }
  .lb-zoom-hint svg{ width:13px; height:13px; }
  .lb-zoom-hint.hide{ opacity:0; }

  .lb-icon-btn{
    position:absolute;
    top:15px;
    width:30px; height:30px;
    background:#fff;
    border:none;
    border-radius:50%;
    color:var(--ink);
    cursor:pointer;
    display:flex; align-items:center; justify-content:center;
    box-shadow:var(--shadow-sm);
    z-index:2;
    transition:background .2s ease;
  }
  .lb-icon-btn:hover{ background:#ffffffbd; }
  .lb-icon-btn svg{ width:13px; height:13px; }
  .lb-close{ right:15px; }

  .lb-toast{
    position:absolute;
    top:20px; left:50%;
    transform:translate(-50%,-10px);
    background:var(--ink);
    color:#fff;
    font-size:12px;
    font-weight:600;
    padding:6px 14px;
    border-radius:20px;
    opacity:0;
    pointer-events:none;
    transition:opacity .2s ease, transform .2s ease;
    z-index:3;
    white-space:nowrap;
  }
  .lb-toast.show{
    opacity:1;
    transform:translate(-50%,0);
  }

  .lb-nav{
    position:absolute;
    top:50%; transform:translateY(-50%);
    width:36px; height:40px;
    background:#fff;
    border:none;
    border-radius:14px;
    display:flex; align-items:center; justify-content:center;
    cursor:pointer;
    color:var(--ink);
    box-shadow:var(--shadow-sm);
    transition:.2s;
  }
  .lb-nav:hover{ background:#ffffffbd; }
  .lb-nav svg{ width:15px; height:15px; }
  .lb-prev{ left:15px; }
  .lb-next{ right:15px; }


.lb-frame.zoomed-active .lb-nav{
    opacity:0;
    pointer-events:none;
}
  .lb-dots{
    display:flex;
    gap:6px;
    justify-content:center;
    padding:18px 0 0;
  }
  .lb-dots span{
    width:6px; height:6px;
    border-radius:50%;
    background:#ddd2bd;

<script>
/*================================================================
   CUM ADAUGI O ICOANĂ NOUĂ — foarte simplu:

   1) Pune pozele icoanei într-un folder, ex: "poze/icoana-maicii-domnului-1.jpg"
   2) Copiază un bloc { ... } din lista ICOANE de mai jos.
   3) Completează:
        nume:       numele icoanei
        pret:       prețul (doar numărul, ex: 350)
        dimensiune: dimensiunea obiectului (ex: "20x30 cm")
        imagini: [ "poze/poza1.jpg", "poze/poza2.jpg", ... ]
                 poți pune 1 singură poză sau mai multe — la clic,
                 toate se văd în chenarul mare, cu săgeți.
   4) Salvează fișierul. Gata — apare automat în galerie și în căutare
      (căutarea ignoră automat diacriticele: "casa" găsește "Casă").
===================================================================== */


const ICOANE = [
  { nume:"Sf. Arh. Mihail", pret:2000, dimensiune:"20×29 cm", data:"2026-09-01",
    imagini:["Icoana_sf_arh_mihail.png"] },

  { nume:"Sf. Ev. Matei", pret:2000, dimensiune:"20×29 cm", data:"2026-09-01",
    imagini:["Icoana_sf_cuv_matei.jpg"] },

  { nume:"Sf. Cuv. Maxim Mărturisitorul", pret:2500, dimensiune:"21×29,7 cm", data:"2026-09-01",
    imagini:["Icoana_sf_cuv_maxim_marturisitorul.png"] },

  { nume:"Sf. Ier. Nicolae", pret:2500, dimensiune:"21×29,7 cm", data:"2026-09-01",
    imagini:["Icoana_sf_ier_nicolas.png"] },

  { nume:"Sf. Marionela Egipteanca", pret:2500, dimensiune:"21×29,7 cm", data:"2026-09-01",
    imagini:["Icoana_sf_marionela_egipteanca.png"] },

  { nume:"Sf. Mc. Tatiana", pret:3200, dimensiune:"29,7×42 cm", data:"2026-09-01",
    imagini:["Icoana_sf_mc_tatiana.jpg"] },

  { nume:"Sf. Mucenița Filoteia", pret:2000, dimensiune:"20×29 cm", data:"2026-09-01",
    imagini:["Icoana_sf_mucenita_filoteia.png"] },

  { nume:"Sf. Proroc Ilie", pret:2500, dimensiune:"21×29,7 cm", data:"2026-09-01",
    imagini:["Icoana_sf_proroc_ilie.png"] },

  { nume:"Sf. Paisie Aghioritul", pret:2500, dimensiune:"21×29,7 cm", data:"2026-09-01",
    imagini:["Icoana_sf_paisie.jpg"] },
];

/* ---------------------------------------------------------------- */
/* Căutare "smart" — ignoră diacriticele românești (ă/â/î/ș/ț) și
   majusculele, ca "casa" să găsească "Casă", "sant" să găsească "Sfânt" etc. */
function normalizeText(str){
  return String(str)
    .normalize('NFD')            // desparte litera de semnul diacritic (ă -> a + ˘)
    .replace(/[\u0300-\u036f]/g, '') // elimină semnele diacritice rămase
    .toLowerCase()
    .trim();
}

function levenshtein(a, b){
  const m = a.length, n = b.length;
  if(!m) return n;
  if(!n) return m;
  const dp = Array.from({length:m+1}, () => new Array(n+1).fill(0));
  for(let i=0;i<=m;i++) dp[i][0] = i;
  for(let j=0;j<=n;j++) dp[0][j] = j;
  for(let i=1;i<=m;i++){
    for(let j=1;j<=n;j++){
      dp[i][j] = a[i-1] === b[j-1]
        ? dp[i-1][j-1]
        : 1 + Math.min(dp[i-1][j-1], dp[i-1][j], dp[i][j-1]);
    }
  }
  return dp[m][n];
}

function fuzzyThreshold(len){
  if(len <= 2) return 1;
  return 2;
}

function wordMatches(word, query){
  if(word.includes(query)) return true;
  return levenshtein(word, query) <= fuzzyThreshold(query.length);
}

function itemMatchesQuery(item, query){
  const qTokens = normalizeText(query).split(/\s+/).filter(Boolean);
  const nameTokens = normalizeText(item.nume).split(/\s+/).filter(Boolean);
  return qTokens.every(q => nameTokens.some(w => wordMatches(w, q)));
}

const filterToateBtn = document.querySelector('[data-filter="toate"]');
const sortBtnNume = document.getElementById('sortBtnNume');

let sortType = null; // null = ordine implicită, 'nume', 'pret'
let sortDir = null;  // 'asc' | 'desc'

const BROKEN_ICON_SVG = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="18" height="18" rx="2"/><circle cx="8.5" cy="8.5" r="1.5"/><path d="M21 15l-5-5L5 21"/></svg>';

/* Pornește urmărirea stării unei imagini (thumbnail sau lightbox), dar
   arată loaderul DOAR dacă poza chiar mai durează să se încarce —
   nu la fiecare afișare (evită "flash"-ul de loader pe poze din cache). */
function watchImageLoad(imgEl, stateEl, {delay = 120, onDone} = {}){
  let settled = false;
  let showTimer = null;

  stateEl.classList.remove('show', 'broken');
  imgEl.classList.remove('is-hidden');

  // dacă poza e deja în cache, browserul o marchează "complete" aproape imediat
  if(imgEl.complete && imgEl.naturalWidth > 0){
    settled = true;
    if(onDone) onDone(true);
    return;
  }

  showTimer = setTimeout(() => {
    if(!settled) stateEl.classList.add('show');
  }, delay);

  imgEl.onload = () => {
    settled = true;
    clearTimeout(showTimer);
    stateEl.classList.remove('show', 'broken');
    imgEl.classList.remove('is-hidden');
    if(onDone) onDone(true);
  };
  imgEl.onerror = () => {
    settled = true;
    clearTimeout(showTimer);
    stateEl.classList.add('show', 'broken');
    imgEl.classList.add('is-hidden');
    if(onDone) onDone(false);
  };
}
const scrollRevealObserver = new IntersectionObserver((entries) => {
  entries.forEach((entry) => {
    if(entry.isIntersecting){
      entry.target.classList.add('in-view');
      scrollRevealObserver.unobserve(entry.target);
    }
  });
}, { threshold: 0.02, rootMargin: '0px 0px -1px 0px' });


function render(list){
  gridEl.innerHTML = '';
  list.forEach((item, index) => {
    const card = document.createElement('div');
    card.className = 'card';
    card.innerHTML = `
      <div class="thumb">
        <div class="thumb-inner">
          <img src="${item.imagini[0]}" alt="${item.nume}">
          <div class="thumb-state">
            <div class="thumb-spinner"></div>
            <div class="thumb-broken">${BROKEN_ICON_SVG}</div>
          </div>
        </div>
        ${item.imagini.length > 1 ? `
          <div class="multi-badge">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
              <rect x="3" y="7" width="14" height="14" rx="1.5"/><path d="M7 7V4.5A1.5 1.5 0 0 1 8.5 3H19A1.5 1.5 0 0 1 20.5 4.5V15a1.5 1.5 0 0 1-1.5 1.5H17"/>
            </svg>
            ${item.imagini.length}
          </div>` : ''}
      </div>
      <div class="caption">
        <p class="nume">${item.nume}</p>
        <div class="info-row">
          <span class="pret">${item.pret} MDL</span>
        </div>
      </div>
    `;
    card.addEventListener('click', () => openLightbox(item));
    const thumbImg = card.querySelector('.thumb-inner img');
    const thumbState = card.querySelector('.thumb-state');
    watchImageLoad(thumbImg, thumbState);
    card.style.setProperty('--reveal-delay', `${(index % 4) * 0.1}s`);
    gridEl.appendChild(card);
    scrollRevealObserver.observe(card);
  });
}

function getFilteredSortedList(){
  let list = [...ICOANE];

  if(searchQuery){
    list = list.filter(item => itemMatchesQuery(item, searchQuery));
  }

  if(sortType === 'pret'){
    list.sort((a,b)=> sortDir === 'asc' ? a.pret-b.pret : b.pret-a.pret);
  } else if(sortType === 'nume'){
    list.sort((a,b)=> sortDir === 'asc'
      ? a.nume.localeCompare(b.nume,'ro')
      : b.nume.localeCompare(a.nume,'ro'));
  } else {
    // implicit ("Toate"): cele mai noi icoane primele
    list.sort((a,b)=> (b.data || '').localeCompare(a.data || ''));
  }
  return list;
}

function applySort(){
  const list = getFilteredSortedList();
  const hasQuery = searchQuery.trim().length > 0;

  gridEl.style.display = list.length ? '' : 'none';
  emptyState.classList.toggle('show', list.length === 0);
  if(list.length === 0){
    emptyQuery.textContent = `"${searchQuery.trim()}"`;
  }

  searchCount.textContent = hasQuery
    ? (list.length === 0
        ? ''
        : `${list.length} ${list.length === 1 ? 'rezultat' : 'rezultate'} pentru „${searchQuery.trim()}”`)
    : '';

  render(list);
}

}

function clearActive(){

sortBtnPret.addEventListener('click', (e) => {

menuNume.querySelectorAll('.dropdown-opt').forEach(opt => {

menuPret.querySelectorAll('.dropdown-opt').forEach(opt => {

/* ---------------------------------------------------------------- */
/* SCROLL TO TOP — apare după ce derulezi mai mult de 4 chenare */

const scrollTopBtn = document.getElementById('scrollTopBtn');

function getScrollThreshold(){
  const firstCard = gridEl.querySelector('.card');
  // câte carduri încap pe un rând, ca să știm după câte "rânduri" de 4 carduri apare butonul
  const gridStyle = window.getComputedStyle(gridEl);
  const colCount = gridStyle.getPropertyValue('grid-template-columns').split(' ').length || 2;
  if(!firstCard) return 600; // fallback rezonabil dacă grila e goală
  const cardHeight = firstCard.getBoundingClientRect().height;
  const rowsFor4Cards = Math.max(1, Math.ceil(4 / colCount));
  return gridEl.offsetTop + rowsFor4Cards * (cardHeight + 20);
}

let scrollThreshold = null;

function updateScrollBtn(){
  if(scrollThreshold === null) scrollThreshold = getScrollThreshold();
  const scrolled = window.scrollY || document.documentElement.scrollTop;
  scrollTopBtn.classList.toggle('show', scrolled > scrollThreshold);
}

window.addEventListener('scroll', updateScrollBtn, { passive:true });
window.addEventListener('resize', () => { scrollThreshold = null; });
window.addEventListener('load', () => { scrollThreshold = null; updateScrollBtn(); });

scrollTopBtn.addEventListener('click', () => {
  window.scrollTo({ top:0, behavior:'smooth' });
});

/* ---------------------------------------------------------------- */
/* LIGHTBOX */

// ⚠️ PUNE AICI NUMĂRUL TĂU DE WHATSAPP (format: cod țară + număr, fără + sau spații)
const WHATSAPP_NUMBER = "37360400898";

const lightbox = document.getElementById('lightbox');
const lbImg = document.getElementById('lbImg');
const lbNume = document.getElementById('lbNume');
const lbPret = document.getElementById('lbPret');
const lbDots = document.getElementById('lbDots');
const lbDim = document.getElementById('lbDim');
const lbZoomHint = document.getElementById('lbZoomHint');
const lbToast = document.getElementById('lbToast');
const lbOrder = document.getElementById('lbOrder');
const lbLoading = document.getElementById('lbLoading');
const lbBroken = document.getElementById('lbBroken');
let currentItem = null;
let currentIdx = 0;

function renderDots(){
  lbDots.innerHTML = '';
  if(currentItem.imagini.length < 2) return;
  currentItem.imagini.forEach((_, i) => {
    const dot = document.createElement('span');
    if(i === currentIdx) dot.classList.add('active');
    dot.addEventListener('click', () => { currentIdx = i; updateImage(); });
    lbDots.appendChild(dot);
  });
}
function resetZoom(){
  lbImg.classList.remove('zoomed');
  lbZoomHint.classList.remove('hide');
  lbFrame.classList.remove('zoomed-active');
}
function updateImage(){
  resetZoom();
  lbZoomHint.classList.add('hide');
  lbBroken.classList.remove('show');
  lbLoading.classList.remove('show');

  lbImg.src = currentItem.imagini[currentIdx];
  [...lbDots.children].forEach((d,i)=> d.classList.toggle('active', i===currentIdx));

  watchImageLoad(lbImg, lbLoading, {
    onDone: (success) => {
      if(success){
        resetZoom();
      } else {
        lbLoading.classList.remove('show');
        lbBroken.innerHTML = BROKEN_ICON_SVG + '<span>Imagine indisponibilă</span>';
        lbBroken.classList.add('show');
        lbZoomHint.classList.add('hide');
      }
    }
  });
}
document.getElementById('lbPrev').addEventListener('click', () => {
  currentIdx = (currentIdx - 1 + currentItem.imagini.length) % currentItem.imagini.length;
  updateImage();
});
document.getElementById('lbNext').addEventListener('click', () => {
  currentIdx = (currentIdx + 1) % currentItem.imagini.length;
  updateImage();
});
document.getElementById('lbClose').addEventListener('click', closeLightbox);
lightbox.addEventListener('click', (e) => { if(e.target === lightbox) closeLightbox(); });
function closeLightbox(){ lightbox.classList.remove('open'); }
document.addEventListener('keydown', (e) => {
  if(!lightbox.classList.contains('open')) return;
  if(e.key === 'Escape') closeLightbox();
  if(e.key === 'ArrowLeft') document.getElementById('lbPrev').click();
  if(e.key === 'ArrowRight') document.getElementById('lbNext').click();
});

/* Zoom pe imagine — punctul de zoom e exact acolo unde apeși */
const lbFrame = document.getElementById('lbFrame');

lbImg.addEventListener('click', (e) => {
  if(lbImg.classList.contains('is-hidden')) return;
  const isZoomed = lbImg.classList.contains('zoomed');
  if(!isZoomed){
    const rect = lbImg.getBoundingClientRect();
    const x = ((e.clientX - rect.left) / rect.width) * 100;
    const y = ((e.clientY - rect.top) / rect.height) * 100;
    lbImg.style.transformOrigin = `${x}% ${y}%`;
    lbImg.classList.add('zoomed');
    lbZoomHint.classList.add('hide');
    lbFrame.classList.add('zoomed-active');
  } else {
    lbImg.classList.remove('zoomed');
    lbZoomHint.classList.remove('hide');
    lbFrame.classList.remove('zoomed-active');
  }
});
lbImg.addEventListener('touchend', (e) => {
  if(!lbImg.classList.contains('zoomed')) return; // doar când e deja zoomat, setează originea pentru viitorul tap
  const touch = e.changedTouches[0];
  if(!touch) return;
  const rect = lbImg.getBoundingClientRect();
  const x = ((touch.clientX - rect.left) / rect.width) * 100;
  const y = ((touch.clientY - rect.top) / rect.height) * 100;
  lbImg.style.transformOrigin = `${x}% ${y}%`;
}, { passive:true });

const lbFrameInner = document.getElementById('lbFrameInner');

/* Elastic: distanța de drag e "amortizată" ca să pară un elastic, nu deplasare 1:1 */
function elasticDamp(distance, max = 10){
  const resistance = 0.1;
  return Math.sign(distance) * max * (1 - Math.exp(-Math.abs(distance) / (max / resistance)));
}

/* Navigare prin swipe (mobil) și scroll cu rotița (desktop) */
let touchStartX = 0;
let touchStartY = 0;
let touchDragging = false;

lbFrameInner.addEventListener('touchstart', (e) => {
  if(lbImg.classList.contains('zoomed')) return;
  const touch = e.touches[0];
  touchStartX = touch.clientX;
  touchStartY = touch.clientY;
  touchDragging = true;
  lbImg.classList.add('dragging');
}, { passive:true });

lbFrameInner.addEventListener('touchmove', (e) => {
  if(!touchDragging || lbImg.classList.contains('zoomed')) return;
  const touch = e.touches[0];
  const diffX = touch.clientX - touchStartX;
  const diffY = touch.clientY - touchStartY;
  if(Math.abs(diffX) > Math.abs(diffY)){
    lbImg.style.transform = `translateX(${elasticDamp(diffX)}px)`;
  }
}, { passive:true });

lbFrameInner.addEventListener('touchend', (e) => {
  touchDragging = false;
  lbImg.classList.remove('dragging');
  lbImg.classList.add('snap-back');
  lbImg.style.transform = '';
  setTimeout(() => lbImg.classList.remove('snap-back'), 450);

  if(lbImg.classList.contains('zoomed')) return;
  const touch = e.changedTouches[0];
  if(!touch) return;
  const diffX = touch.clientX - touchStartX;
  const diffY = touch.clientY - touchStartY;

  if(Math.abs(diffX) > 50 && Math.abs(diffX) > Math.abs(diffY)){
    if(diffX < 0) document.getElementById('lbNext').click();
    else document.getElementById('lbPrev').click();
  }
});

let wheelCooldown = false;
lbFrameInner.addEventListener('wheel', (e) => {
  if(lbImg.classList.contains('zoomed')) return;
  if(wheelCooldown) return;
  if(Math.abs(e.deltaY) < 20 && Math.abs(e.deltaX) < 20) return;

  wheelCooldown = true;
  setTimeout(() => { wheelCooldown = false; }, 400);

  const delta = Math.abs(e.deltaX) > Math.abs(e.deltaY) ? e.deltaX : e.deltaY;
  if(delta > 0) document.getElementById('lbNext').click();
  else document.getElementById('lbPrev').click();
}, { passive:true });

/* Navigare prin drag cu mouse-ul (desktop) */
let mouseDownX = 0;
let mouseDownY = 0;
let isDragging = false;

lbFrameInner.addEventListener('mousedown', (e) => {
  if(lbImg.classList.contains('zoomed')) return;
  isDragging = true;
  mouseDownX = e.clientX;
  mouseDownY = e.clientY;
  lbFrameInner.style.cursor = 'grabbing';
  lbImg.classList.add('dragging');
});

lbFrameInner.addEventListener('mousemove', (e) => {
  if(!isDragging || lbImg.classList.contains('zoomed')) return;
  const diffX = e.clientX - mouseDownX;
  const diffY = e.clientY - mouseDownY;
  if(Math.abs(diffX) > Math.abs(diffY)){
    lbImg.style.transform = `translateX(${elasticDamp(diffX)}px)`;
  }
});

function endMouseDrag(e){
  if(!isDragging) return;
  isDragging = false;
  lbFrameInner.style.cursor = '';
  lbImg.classList.remove('dragging');
  lbImg.classList.add('snap-back');
  lbImg.style.transform = '';
  setTimeout(() => lbImg.classList.remove('snap-back'), 450);

  const diffX = e.clientX - mouseDownX;
  const diffY = e.clientY - mouseDownY;

  if(Math.abs(diffX) > 60 && Math.abs(diffX) > Math.abs(diffY)){
    if(diffX < 0) document.getElementById('lbNext').click();
    else document.getElementById('lbPrev').click();
  }
}

lbFrameInner.addEventListener('mouseup', endMouseDrag);
lbFrameInner.addEventListener('mouseleave', endMouseDrag);

/* Comandă prin WhatsApp */
function buildOrderLink(item){
  const msg = `Bună! Sunt interesat/ă de icoana "${item.nume}" (${item.pret} MDL, ${item.dimensiune}).`;
  return `https://wa.me/${WHATSAPP_NUMBER}?text=${encodeURIComponent(msg)}`;
}

function openLightbox(item){
  currentItem = item;
  currentIdx = 0;
  lbNume.textContent = item.nume;
  lbPret.textContent = item.pret + ' MDL';
  lbDim.textContent = item.dimensiune;
  lbOrder.href = buildOrderLink(item);
  const hasMultiple = item.imagini.length > 1;
  document.getElementById('lbPrev').style.display = hasMultiple ? 'flex' : 'none';
  document.getElementById('lbNext').style.display = hasMultiple ? 'flex' : 'none';
  renderDots();
  updateImage();
  lightbox.classList.add('open');
}

}

customClose.addEventListener('click', closeCustomModal);

customConfirm.addEventListener('click', () => {
  const nume = customNume.value.trim();
  const lat = customLat.value.trim();
  const inalt = customInalt.value.trim();

  if(!nume){
    customError.textContent = 'Te rugăm introdu numele Sfântului.';

  window.open(link, '_blank');
  closeCustomModal();
});

document.addEventListener('keydown', (e) => {
  if(!customModal.classList.contains('open')) return;
  if(e.key === 'Escape') closeCustomModal();
});
